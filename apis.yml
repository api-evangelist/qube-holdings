aid: qube-holdings

name: Qube Holdings

description: Qube Holdings is Australia's largest integrated provider of import and export logistics services, operating across
  Australia, New Zealand and South-East Asia with a workforce of around 10,000 employees. Its Operating Division comprises
  Qube Logistics and Qube Ports and Bulk, and it holds a 50 per cent interest in Patrick Terminals, Australia's leading container
  terminal operator. Formerly ASX-listed (Qube Holdings LTD), Qube is now a private company majority-owned by a Macquarie
  Asset Management-led consortium including UniSuper and Pontegadea. Customers interact through login-gated web portals (Services
  Portal, Gateway, Global Track & Trace); no public developer API documentation was found on its sites.

